namespaces:
  domain:
    do_not_use_when: A more specific system, topic, layer, or pattern tag applies.
    examples:
    - domain:knowledge-management
    - domain:task-execution
    meaning: Problem domain or durable area of concern.
    use_when: The atom belongs to a reusable problem domain.
  layer:
    do_not_use_when: The tag names only a broad topic or system.
    examples:
    - layer:document-model
    - layer:runtime
    - layer:cli
    meaning: Architectural layer where the atom applies.
    use_when: The atom is scoped to a layer of the system.
  multi_example:
    do_not_use_when: not
    examples:
    - multi_example:ex1
    - multi_example:ex2
    - multi_example:ex3
    meaning: test
    use_when: testing
  pattern:
    do_not_use_when: The atom merely mentions a topic; use topic instead.
    examples:
    - pattern:roundtrip-validation
    meaning: Reusable solution shape or recurring implementation method.
    use_when: The atom describes a repeatable way to solve or structure something.
  system:
    do_not_use_when: The tag is only a general topic.
    examples:
    - system:deskops
    - system:sldb
    meaning: System, project, or tool the atom belongs to.
    use_when: The atom is about a specific system.
  testex:
    do_not_use_when: no examples needed
    examples:
    - testex:foo
    - testex:bar
    meaning: test examples
    use_when: testing example flag
  testns:
    do_not_use_when: not testing
    examples: []
    meaning: test
    use_when: testing
  topic:
    do_not_use_when: The atom describes a reusable implementation shape.
    examples:
    - topic:atoms
    - topic:composition
    meaning: Subject area discussed by the atom.
    use_when: The atom is about a conceptual topic.
  valid_underscore:
    do_not_use_when: x
    examples: []
    meaning: x
    use_when: x
