[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge"
version = "0.1.0"
description = "Knowledge management system for conversational agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
knowledge-cli = "knowledge.cli.main:main"

[project.urls]
Homepage = "https://github.com/jpcosec/knowledge"
Repository = "https://github.com/jpcosec/knowledge"

[tool.setuptools.packages.find]
where = ["src"]
