[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pron"
version = "1.0.0.dev1"
description = "pron: a SHRDLU over an sldb world — nouns by address in sldb, transitive verbs as kgdb relation models, action verbs as sldb writes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "sldb",
    "kgdb",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pron = "pron.cli.main:main"

[project.urls]
Homepage = "https://github.com/jpcosec/pron"
Repository = "https://github.com/jpcosec/pron"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pron = ["surface/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
