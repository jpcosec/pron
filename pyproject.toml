[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pron"
version = "1.0.0.dev0"
description = "pron: a SHRDLU over an sldb world — nouns by address in sldb, transitive verbs as kgdb relation models, action verbs as sldb writes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sldb",
    "kgdb",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/jpcosec/pron"
Repository = "https://github.com/jpcosec/pron"

# No package yet: master holds the specification and the views. The v1 package lives on
# the branch v1-code-and-kb (tag v1-frozen).
[tool.setuptools]
packages = []
