[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pron"
version = "1.0.0"
description = "pron: a SHRDLU over an sldb world — nouns by address in sldb, transitive verbs as relation models read through sldb's typed edge index, action verbs as sldb writes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2",
    "PyYAML>=6",
    "sldb",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "syrupy==6.1.1", "ruff==0.14.0", "mypy==1.14.1", "types-PyYAML"]

[project.scripts]
pron = "pron.cli.main:main"

[project.urls]
Homepage = "https://github.com/jpcosec/pron"
Repository = "https://github.com/jpcosec/pron"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pron = ["surface/*.yaml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

# Layer 1 of standards.md (hum-ecosystem/tools/sldb), size/structure only: blocking for the
# code and the tests alike (a test world's declaration lives in data files, not in code).
# File length is checked by tools/check_file_length.py in `make lint`.
[tool.ruff.lint]
extend-select = ["C901", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.pylint]
max-statements = 10  # approximates "no function over 10 lines of logic"
max-branches = 8
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.11"
files = ["src/pron"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sldb.*"]
follow_imports = "skip"
ignore_missing_imports = true
