[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pron"
version = "1.0.0"
description = "pron: a SHRDLU over an sldb world — nouns by address in sldb, transitive verbs as kgdb relation models, action verbs as sldb writes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "sldb",
    "kgdb",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.14.0", "mypy==1.14.1", "types-PyYAML"]

[project.scripts]
pron = "pron.cli.main:main"

[project.urls]
Homepage = "https://github.com/jpcosec/pron"
Repository = "https://github.com/jpcosec/pron"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pron = ["surface/*.yaml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src/pron"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sldb.*", "kgdb.*", "networkx.*"]
follow_imports = "skip"
ignore_missing_imports = true
