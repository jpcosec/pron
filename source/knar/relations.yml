id: knar-atom-relations
interpretation: Relaciones editoriales entre afirmaciones; no conexiones de puertos
  ni dependencias de ejecución.
relation_types:
  elaborates: La afirmación origen desarrolla un aspecto de la afirmación destino.
  explains: La afirmación origen aporta una razón o distinción para comprender el
    destino.
  constrains: La afirmación origen limita la aplicación de la afirmación destino.
  contrasts_with: Las afirmaciones describen conceptos que deben distinguirse.
  exemplifies: La afirmación origen describe un ejemplo del concepto del destino.
  organizes: La afirmación origen organiza un concepto desarrollado en el destino.
  proposes_implementation_of: La propuesta origen plantea una implementación posible
    del requisito destino.
