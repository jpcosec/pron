id: pron.codigo.capas
title: pron — código · paquetes y el recorrido de un turno
type: component
version: '2.0'
metadata:
  description: >
    El código de src/pron por eje: kernel/ (primitivas y escrituras), world/ (el mundo
    desde sldb), surface/ (lenguaje natural → formas) y sexpr/ (formas ↔ sldb/kgdb),
    con sexpr/ partido en las fases del turno. No es la arquitectura objetivo de
    source/spec — ese diagrama es target.components.yml — sino el mapeo actual entre
    esas piezas y sus carpetas.
style:
  theme: default
data:
  nodes:
    entrada:
      label: Entrada
      kind: boundary
      contains: [cli, remote, serve]
    cli:
      label: "cli/ · un comando por archivo en commands/ · init, refresh, lexicon, say, eval, repl, serve, check, docs"
      kind: bridge
    remote:
      label: "remote/ · RemoteSession · solo biblioteca estándar, habla por .pron/serve.sock"
      kind: bridge
    serve:
      label: "serve.py · Server · el daemon con los mundos abiertos"
      kind: bridge
    sesion:
      label: "session.py · Session · turn() y eval(), fachada clavada por spec 12"
      kind: core
    world:
      label: world/ · el mundo desde sldb
      kind: layer
      contains: [mundo, lexico]
    mundo:
      label: "world.py, store.py, graph.py · abre el store, lee su declaración, refresca el grafo"
      kind: layer
    lexico:
      label: "lexicon.py, matching/ · las palabras salen de los modelos y los RelationTypeDoc"
      kind: layer
    surface:
      label: "surface/ · classifier, nouns, dates, interpreter, render · oración → partes → formas"
      kind: surface
    sexpr:
      label: sexpr/ · formas ↔ sldb/kgdb, una carpeta por fase del turno
      kind: layer
      contains: [turn, forms, resolving, planning, prevalidation, execution, dialogue]
    turn:
      label: "turn/ · Move, SentenceTurn, FormTurn, Evaluator, move_order, ledger · el turno de punta a punta y su MoveDoc"
      kind: core
    forms:
      label: "forms/ · Compiler, refs · la forma leída se compila a partes"
      kind: core
    resolving:
      label: "resolving/ · resolve, Verbs · sustantivos por dirección en sldb, aristas y condiciones en kgdb"
      kind: core
    planning:
      label: "planning/ · Planner, ComposePlanner · resolver cada frase antes de ejecutar"
      kind: core
    prevalidation:
      label: "prevalidation/ · Prevalidator, DryRunner · simular el movimiento entero antes de escribir"
      kind: core
    execution:
      label: "execution/ · un ejecutor por tipo de parte · read, assert, action, compose, undo, why"
      kind: core
    dialogue:
      label: "dialogue/ · Dialogue, Pending, Asker, Replier, Corrector · la pendiente y los referentes"
      kind: infra
    kernel:
      label: kernel/ · primitivas
      kind: layer
      contains: [parts, sexp, actions, kernelpy]
    parts:
      label: "parts/ · Part, NounPhrase, Item, Word, Response · los datos que viajan por el turno"
      kind: config
    sexp:
      label: "sexp/ · read_write, Sym · el lector y escritor de s-expressions"
      kind: config
    actions:
      label: "actions/ · Verb y un objeto por verbo de acción (dry, execute, undo)"
      kind: core
    kernelpy:
      label: "kernel.py · Kernel · las escrituras de sldb con guardas y deshacer"
      kind: core
    sldb_kgdb:
      label: sldb + kgdb · el mundo, fuera de este repo
      kind: external
  edges:
    - {from: cli, to: sesion, relation: uses}
    - {from: serve, to: sesion, relation: uses}
    - {from: remote, to: serve, relation: talks, label: .pron/serve.sock}
    - {from: sesion, to: turn, relation: runs}
    - {from: turn, to: surface, relation: interpreta, label: una oración}
    - {from: surface, to: forms, relation: produce, label: formas}
    - {from: turn, to: forms, relation: compila}
    - {from: turn, to: planning, relation: planifica}
    - {from: planning, to: resolving, relation: resuelve}
    - {from: turn, to: prevalidation, relation: prevalida}
    - {from: prevalidation, to: actions, relation: "dry"}
    - {from: turn, to: execution, relation: ejecuta}
    - {from: execution, to: kernelpy, relation: escribe}
    - {from: kernelpy, to: actions, relation: execute}
    - {from: turn, to: dialogue, relation: pregunta}
    - {from: resolving, to: sldb_kgdb, relation: reads}
    - {from: kernelpy, to: sldb_kgdb, relation: writes}
    - {from: mundo, to: sldb_kgdb, relation: refresca}
    - {from: lexico, to: mundo, relation: reads}
    - {from: surface, to: lexico, relation: reads}
    - {from: turn, to: parts, relation: uses}
