name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jpcosec/pron
          path: pron
      - uses: actions/checkout@v4
        with:
          repository: jpcosec/sldb
          path: sldb
      - uses: actions/checkout@v4
        with:
          repository: jpcosec/kgdb
          path: kgdb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pin sibling revisions (constraints.txt)
        run: |
          cd pron
          while read -r repo rev _; do
            case "$repo" in sldb|kgdb) git -C "../$repo" checkout -q "$rev";; esac
          done < constraints.txt
      - name: Install
        run: |
          python -m pip install -e ../sldb
          python -m pip install -e ../kgdb
          python -m pip install -e ".[dev]"
      - name: check (lints + typecheck + tests + docs)
        run: make check
