id: pron.architecture
title: Arquitectura actual de pron
type: component
version: '1.0'
metadata:
  description: >
    Estado real del código a 2026-09-07 (no el roadmap "KB System" aspiracional
    del corpus de atoms impl:pending). CLI/REPL sobre un kernel de Meaning
    (s-expresiones ancladas por gramática viva), operaciones que despachan a
    dos bridges — la única puerta a sldb y kgdb — más un generador de
    documentación que deriva CliCommandDoc/SurfaceDoc del propio código fuente.
style:
  theme: default
  kinds:
    entry: {fill: '#4C6EF5', color: '#fff'}
    surface: {fill: '#748FFC', color: '#fff'}
    core: {fill: '#12B886', color: '#fff'}
    ops: {fill: '#20C997', color: '#fff'}
    bridge: {fill: '#F59F00', color: '#fff'}
    infra: {fill: '#E8590C', color: '#fff'}
    external: {fill: '#868E96', color: '#fff'}
    store: {fill: '#495057', color: '#fff'}
    data: {fill: '#ADB5BD', color: '#000'}
data:
  nodes:
    cli:
      label: "CLI (pron <cmd>)"
      kind: entry
    repl:
      label: "REPL (pron repl)"
      kind: entry
    surface:
      label: Surface grammar
      kind: surface
    render:
      label: Renderer (JSON/text)
      kind: surface
    sexpr:
      label: S-expression parser/serializer
      kind: core
    anchors:
      label: AnchorRegistry (gramática viva)
      kind: core
    evaluator:
      label: Evaluator
      kind: core
    resolution:
      label: Cascada de resolución de nouns
      kind: core
    session:
      label: Session (.pron/session.json)
      kind: core
    read_ops:
      label: "Read ops (check/next/return)"
      kind: ops
    write_ops:
      label: "Write ops (create/assert/ingest)"
      kind: ops
    write_models:
      label: FactDoc / PropositionDoc
      kind: ops
    sldb_bridge:
      label: SldbBridge
      kind: bridge
    kgdb_bridge:
      label: KgdbBridge
      kind: bridge
    docs_gen:
      label: "Generador de docs (pron docs)"
      kind: infra
    projector:
      label: "Projector (model add / refresh / project)"
      kind: infra
    sldb_lib:
      label: sldb
      kind: external
    kgdb_lib:
      label: kgdb
      kind: external
    store:
      label: .sldb store + snapshot KGDB
      kind: store
    workspace:
      label: "knowledge/ (atoms, anchors, commands, surfaces)"
      kind: data
  edges:
    - {from: cli, to: surface, relation: desugars, label: "tokens → s-expr"}
    - {from: cli, to: render, relation: renders}
    - {from: cli, to: evaluator, relation: evaluates, label: eval / cmd_eval}
    - {from: cli, to: projector, relation: invokes, label: project / model add}
    - {from: cli, to: docs_gen, relation: invokes, label: docs}
    - {from: cli, to: session, relation: persists, label: resultado ambiguo (no interactivo)}
    - {from: repl, to: surface, relation: desugars, label: "shlex.split"}
    - {from: repl, to: evaluator, relation: evaluates}
    - {from: repl, to: render, relation: renders}
    - {from: surface, to: anchors, relation: resolves, label: kind de cada token}
    - {from: evaluator, to: anchors, relation: grounds, label: "símbolo → anchor"}
    - {from: evaluator, to: resolution, relation: uses, label: selector cascade}
    - {from: evaluator, to: sexpr, relation: uses, label: expand macro / serialize}
    - {from: evaluator, to: read_ops, relation: dispatches, label: check/next/return}
    - {from: evaluator, to: write_ops, relation: dispatches, label: create/assert/ingest}
    - {from: read_ops, to: sldb_bridge, relation: queries}
    - {from: read_ops, to: kgdb_bridge, relation: traverses, label: related/common/also}
    - {from: write_ops, to: sldb_bridge, relation: writes}
    - {from: write_ops, to: write_models, relation: produces}
    - {from: anchors, to: sldb_bridge, relation: reads, label: AnchorDoc}
    - {from: sldb_bridge, to: sldb_lib, relation: uses, label: capa librería}
    - {from: kgdb_bridge, to: kgdb_lib, relation: uses}
    - {from: sldb_bridge, to: store, relation: persists}
    - {from: kgdb_bridge, to: store, relation: persists, label: graph snapshot}
    - {from: sldb_bridge, to: workspace, relation: reads_writes, label: documentos markdown}
    - {from: projector, to: sldb_lib, relation: reindexes}
    - {from: projector, to: kgdb_lib, relation: rebuilds_graph}
    - {from: docs_gen, to: cli, relation: introspects, label: "AST de docstrings _cmd_*"}
    - {from: docs_gen, to: sldb_bridge, relation: uses, label: create_doc / model_names}
    - {from: docs_gen, to: workspace, relation: writes, label: CliCommandDoc/SurfaceDoc}
