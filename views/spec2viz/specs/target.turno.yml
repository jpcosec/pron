id: pron.target.turno
title: pron — arquitectura objetivo · un turno
type: sequence
version: '1.1'
metadata:
  description: >
    Un turno desde que entra una oración hasta que sale una respuesta en
    natural. La superficie compara la oración con los motivos del léxico
    (embeddings) y verifica que cada palabra esté en la proyección. El
    evaluador grounda cada palabra a su entidad, resuelve el sustantivo en
    sldb y lee el verbo en kgdb (si aplica a este sustantivo, si la
    transición es legal desde aquí). Tres salidas del grounding: único
    (el kernel ejecuta primitivas), ambiguo (pregunta y espera), missing
    (cercanos por embeddings, registra el hueco y termina — qué pasa después
    no es de pron). Todo queda en el ledger · "¿por qué?" lo lee.
data:
  participants:
    - {id: hablante, kind: actor}
    - {id: superficie, kind: component}
    - {id: dialogo, kind: component}
    - {id: lexico, kind: component}
    - {id: evaluador, kind: component}
    - {id: kernel, kind: component}
    - {id: sldb, kind: boundary}
    - {id: kgdb, kind: boundary}
    - {id: embeddings, kind: boundary}
    - {id: proyector, kind: component}
    - {id: ledger, kind: boundary}
  messages:
    - {from: hablante, to: superficie, message: "agrega cita al usuario a las 16:00"}
    - {from: superficie, to: dialogo, message: "¿a quién refiere 'al usuario'?", kind: sync}
    - {from: dialogo, to: superficie, message: el usuario de esta sesión}
    - {from: superficie, to: embeddings, message: "oración ↔ motivos del léxico de esta proyección", kind: sync}
    - {from: embeddings, to: superficie, message: palabras candidatas por similitud}
    - {from: superficie, to: lexico, message: "¿cada palabra está en la proyección?", kind: sync}
    - {from: lexico, to: superficie, message: "[sin palabra] 'cita' no está en tu léxico", condition: sin palabra}
    - {from: superficie, to: hablante, message: "[sin palabra] no tengo 'cita' · sí tengo ...", condition: sin palabra}
    - {from: superficie, to: evaluador, message: Meaning}
    - {from: evaluador, to: lexico, message: "cada palabra → su entidad del mundo", kind: sync}
    - {from: evaluador, to: sldb, message: resolver el sustantivo · cascada, kind: sync}
    - {from: evaluador, to: kgdb, message: "leer el verbo · ¿aplica a este sustantivo? · ¿transición legal desde aquí?", kind: sync}
    - {from: evaluador, to: dialogo, message: "[ambiguo] guardar candidatos y Meaning con hueco", condition: ambiguo}
    - {from: evaluador, to: superficie, message: "[ambiguo] ¿cuál?", condition: ambiguo}
    - {from: superficie, to: hablante, message: "[ambiguo] ¿cuál? A o B", condition: ambiguo}
    - {from: evaluador, to: embeddings, message: "[missing] cercanos por similitud", kind: sync, condition: missing}
    - {from: evaluador, to: ledger, message: "[missing] registrar el hueco con motivo y cercanos", condition: missing}
    - {from: evaluador, to: superficie, message: "[missing] no existe · cercanos · esto buscaba", condition: missing}
    - {from: superficie, to: hablante, message: "[missing] no existe X · ¿querías Y o Z?", condition: missing}
    - {from: evaluador, to: kernel, message: "[único] escribir documento · disparar transición", condition: único}
    - {from: kernel, to: sldb, message: escribir el documento, kind: sync}
    - {from: sldb, to: kernel, message: ok + refs}
    - {from: kernel, to: kgdb, message: disparar la transición, kind: sync}
    - {from: kgdb, to: kernel, message: nuevo estado}
    - {from: kernel, to: proyector, message: refrescar tras escribir}
    - {from: evaluador, to: ledger, message: "oración + Meaning + refs + motivos + resultado"}
    - {from: evaluador, to: superficie, message: resultado + traza}
    - {from: superficie, to: hablante, message: "Listo. Queda registrado."}
    - {from: hablante, to: superficie, message: "¿por qué?"}
    - {from: superficie, to: evaluador, message: explicar el último movimiento}
    - {from: evaluador, to: ledger, message: leer la traza, kind: sync}
    - {from: ledger, to: evaluador, message: oración · Meaning · refs · motivos}
    - {from: evaluador, to: superficie, message: la traza}
    - {from: superficie, to: hablante, message: la traza en natural}
