id: pron.target.turno
title: pron — arquitectura objetivo · una conversación sobre un mundo externo
type: sequence
version: '3.1'
metadata:
  description: >
    Cinco turnos de la conversación de source/spec/09 sobre el mundo del
    restaurante (09a), declarado en inglés. Crear un cliente con payload;
    "book her a table", un alias compose que crea la reserva y afirma dos
    verbos, con dos predicados cruzados por intersección de direcciones;
    una frase ambigua y su respuesta; "confirm it" como transición guardada
    por una arista transitions_to y una condición, ambas verificadas en
    sldb; y "why?" desde el ledger y las condiciones. Cada mensaje es la
    llamada real.
data:
  participants:
    - {id: hablante, kind: actor}
    - {id: superficie, kind: component}
    - {id: dialogo, kind: component}
    - {id: lexico, kind: component}
    - {id: sldb_addr, kind: boundary}
    - {id: sldb_write, kind: boundary}
    - {id: kgdb, kind: boundary}
    - {id: kernel, kind: component}
    - {id: proyector, kind: component}
    - {id: ledger, kind: boundary}
  messages:
    - {from: hablante, to: superficie, message: "create a client named Ana Rojas, phone 9 5555 1234"}
    - {from: superficie, to: lexico, message: "create → acción create · client → Client · named → name · phone → phone · literales", kind: sync}
    - {from: superficie, to: sldb_addr, message: "fields show models/Client · obligatorios name, phone", kind: sync}
    - {from: superficie, to: kernel, message: "create Client {name, phone}"}
    - {from: kernel, to: sldb_write, message: "docs create --model Client --name client-ana-rojas (naming del ProjectionDoc)", kind: sync}
    - {from: sldb_write, to: kernel, message: "tracked · hashes"}
    - {from: kernel, to: proyector, message: refresh}
    - {from: proyector, to: kgdb, message: "stores update · semantic-export · kgdb ingest", kind: sync}
    - {from: superficie, to: ledger, message: "MoveDoc · payload · dirección creada · hash_mundo antes y después"}
    - {from: superficie, to: hablante, message: "Created client Ana Rojas."}
    - {from: hablante, to: superficie, message: "book her a table on the terrace for 6 people on Friday at 9pm"}
    - {from: superficie, to: lexico, message: "book her → alias compose (create Reservation · assert booked_by · assert assigned_to) · her → referente · terrace → zone · for 6 → party_size y capacity >= 6", kind: sync}
    - {from: superficie, to: dialogo, message: "her → último singular de clase Client · client-ana-rojas", kind: sync}
    - {from: superficie, to: sldb_addr, message: "find st.{Table} --where 'zone = \"terrace\"' → 12, 14, 20", kind: sync}
    - {from: superficie, to: sldb_addr, message: "find st.{Table} --where 'capacity >= 6' → 12, 14", kind: sync}
    - {from: superficie, to: superficie, message: "∩ → table-12, table-14 · determinante a → table-12"}
    - {from: superficie, to: sldb_addr, message: "get st.{RelationTypeDoc}.booked_by y .assigned_to · tipos y condición capacity >= {party_size}", kind: sync}
    - {from: superficie, to: sldb_addr, message: "find st.{Table} --where 'capacity >= 6' contiene table-12 · condición ok", kind: sync}
    - {from: superficie, to: kernel, message: "create Reservation · assert booked_by → Ana · assert assigned_to → table-12"}
    - {from: kernel, to: sldb_write, message: "docs create Reservation · docs create RelationDoc booked_by · docs create RelationDoc assigned_to", kind: sync}
    - {from: kernel, to: proyector, message: "refresh (una vez)"}
    - {from: proyector, to: kgdb, message: "kgdb ingest · nodos + aristas desde los RelationDoc", kind: sync}
    - {from: superficie, to: ledger, message: "MoveDoc · dos consultas y su intersección · alternativa table-14 · tres documentos"}
    - {from: superficie, to: hablante, message: "Reservation for Ana Rojas on Friday the 11th at 21:00, 6 people, table 12, pending. Table 14 would also work."}
    - {from: hablante, to: superficie, message: "what reservations does Ana have for Friday?"}
    - {from: superficie, to: sldb_addr, message: "find st.{Client} --where 'name ~ \"Ana\"' → ana-perez, ana-rojas", kind: sync}
    - {from: superficie, to: dialogo, message: "[ambiguo] pendiente de elección · dos candidatos", condition: ambiguo}
    - {from: superficie, to: ledger, message: "[ambiguo] MoveDoc · libre → pendiente", condition: ambiguo}
    - {from: superficie, to: hablante, message: "[ambiguo] Which one? (1) Ana Pérez · (2) Ana Rojas", condition: ambiguo}
    - {from: hablante, to: superficie, message: "Rojas"}
    - {from: superficie, to: dialogo, message: "designación contra los candidatos · calce único → ana-rojas", kind: sync}
    - {from: superficie, to: kgdb, message: "edges_to(Client:client-ana-rojas, booked_by) → reservation-2026-09-11-ana-rojas", kind: sync}
    - {from: superficie, to: sldb_addr, message: "find st.{Reservation} --where 'date = \"2026-09-11\"' → ana-rojas, luis-soto", kind: sync}
    - {from: superficie, to: superficie, message: "∩ → una dirección · conjunto de uno = antecedente singular"}
    - {from: superficie, to: ledger, message: "MoveDoc · pendiente → libre"}
    - {from: superficie, to: hablante, message: "One · Friday the 11th at 21:00, 6 people, table 12, pending."}
    - {from: hablante, to: superficie, message: "confirm it"}
    - {from: superficie, to: lexico, message: "confirm it → alias action change status=confirmed · it → referente Reservation", kind: sync}
    - {from: superficie, to: sldb_addr, message: "get st.{Reservation}.reservation-….status → pending", kind: sync}
    - {from: superficie, to: sldb_addr, message: "find st.{State} machine = Reservation.status ∩ name = pending → state-reservation-pending", kind: sync}
    - {from: superficie, to: sldb_addr, message: "find st.{RelationDoc} source_id = State:… ∩ relation_type = transitions_to → confirmed (condition party_size <= 8), cancelled", kind: sync}
    - {from: superficie, to: sldb_addr, message: "find st.{Reservation} --where 'party_size <= 8' contiene la reserva · transición legal", kind: sync}
    - {from: superficie, to: kernel, message: "change status"}
    - {from: kernel, to: sldb_write, message: "fields update docs/reservation-…/status '\"confirmed\"'", kind: sync}
    - {from: kernel, to: proyector, message: refresh}
    - {from: superficie, to: ledger, message: "MoveDoc · estado anterior y nuevo · arista y condición evaluada"}
    - {from: superficie, to: hablante, message: "Confirmed."}
    - {from: hablante, to: superficie, message: "why?"}
    - {from: superficie, to: ledger, message: "último MoveDoc con escritura sobre la reserva", kind: sync}
    - {from: ledger, to: superficie, message: "oración · arista transitions_to · condición party_size <= 8 · quién · cuándo"}
    - {from: superficie, to: kgdb, message: "edges_from(reservation, eje WHY / PROVENANCE)", kind: sync}
    - {from: superficie, to: hablante, message: "Because you asked, and pending → confirmed was legal · 6 people, limit 8."}
