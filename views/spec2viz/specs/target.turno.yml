id: pron.target.turno
title: pron — arquitectura objetivo · tres turnos
type: sequence
version: '2.0'
metadata:
  description: >
    Tres oraciones que cubren los tres tipos de palabra. Un sustantivo con
    un verbo transitivo leído ("¿qué implementa el átomo de bridges?"): la
    superficie arma la dirección, sldb la responde, kgdb da las aristas. Un
    verbo transitivo afirmado ("ese átomo implementa el modelo SldbBridge"):
    se verifica contra el RelationTypeDoc de kgdb y se escribe como RelationDoc,
    un documento más del store; el ingest de kgdb lo vuelve arista. Un verbo de acción ("cambia la
    sinopsis del comando repl"): un fields update. Las tres salidas del
    grounding — único, ambiguo, missing — se muestran sobre el primer turno.
    Los sustantivos son del mundo de pron: su modelo de átomo, sus comandos y
    superficies documentadas.
