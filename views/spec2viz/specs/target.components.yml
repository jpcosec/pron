id: pron.target.components
title: pron — arquitectura objetivo · componentes
type: component
version: '1.1'
metadata:
  description: >
    Hacia dónde va pron: un SHRDLU montado sobre el mundo tal como los dos
    stores lo reparten. Los sustantivos — los objetos del mundo — son
    documentos de sldb. Los verbos — acciones, transiciones, relaciones —
    son el grafo de kgdb. Pron no tiene operaciones: las lee del grafo y las
    interpreta; lo único que es código es un kernel de primitivas (leer y
    escribir un documento, recorrer una arista, disparar una transición).
    Los anchors son el léxico: palabras que nombran cosas que ya existen,
    por proyección, con un motivo que sirve al humano, a los errores y a la
    traducción de la superficie (similitud entre la oración y los motivos).
    El léxico mismo son documentos sldb.
style:
  theme: default
data:
  nodes:
    afuera:
      label: Fuera de pron
      kind: boundary
      contains: [hablante]
    hablante:
      label: Quien habla · persona, LLM u otro producto
      kind: actor
    capa0:
      label: Capa 0 · Mundo
      kind: layer
      contains: [mundo]
    mundo:
      label: "Declaración del mundo · qué stores y grafo, qué léxico, qué proyecciones"
      kind: config
    capa1:
      label: Capa 1 · Superficie
      kind: layer
      contains: [superficie]
    superficie:
      label: "Superficie · natural → Meaning · Meaning → natural"
      kind: surface
    capa2:
      label: Capa 2 · Meaning
      kind: layer
      contains: [lexico, proyeccion, dialogo, evaluador, kernel]
    lexico:
      label: "Léxico · anchors · palabra → entidad del mundo · motivo"
      kind: core
    proyeccion:
      label: "Proyección · lo que esta sesión puede nombrar"
      kind: core
    dialogo:
      label: "Diálogo · pendiente y referentes (ese, la anterior)"
      kind: core
    evaluador:
      label: "Evaluador · grounding · resolución · interpreta verbos del grafo · traza"
      kind: core
    kernel:
      label: "Kernel de primitivas · leer doc · escribir doc · recorrer arista · disparar transición"
      kind: core
    capa3:
      label: Capa 3 · Bridges
      kind: layer
      contains: [bridge_sldb, bridge_kgdb, bridge_emb, bridge_otros]
    bridge_sldb:
      label: "Bridge sldb · documentos, campos, secciones"
      kind: bridge
    bridge_kgdb:
      label: "Bridge kgdb · aristas, transiciones, estados"
      kind: bridge
    bridge_emb:
      label: "Bridge embeddings · oración ↔ motivos · cercanos"
      kind: bridge
    bridge_otros:
      label: "Bridge lo-que-venga · SQL, APIs, ..."
      kind: bridge
    transversal:
      label: Transversal
      kind: layer
      contains: [proyector, ledger]
    proyector:
      label: "Proyector · reindexa · reconstruye grafo · recalcula embeddings"
      kind: infra
    ledger:
      label: "Ledger · oración + Meaning + refs + motivos + resultado · provenance"
      kind: infra
    backends:
      label: Backends · el mundo
      kind: boundary
      contains: [sldb, kgdb, embeddings, otros]
    sldb:
      label: "sldb · SUSTANTIVOS · documentos, modelos, recetas, el léxico mismo"
      kind: external
    kgdb:
      label: "kgdb · VERBOS · acciones, transiciones, relaciones"
      kind: external
    embeddings:
      label: embeddings
      kind: external
    otros:
      label: "SQL · APIs · lo que venga"
      kind: external
  edges:
