id: pron.target.components
title: pron — arquitectura objetivo · componentes
type: component
version: '1.0'
metadata:
  description: >
    Hacia dónde va pron: un SHRDLU sobre un mundo declarado. Quien habla —
    persona, LLM u otro producto — es un solo actor externo. Una única
    superficie natural ↔ Meaning; un evaluador que grounda contra la
    gramática viva acotada por la proyección; operaciones abiertas; una
    puerta por backend. Un hueco (missing) usa embeddings para ofrecer
    cercanos por similitud, no solo por texto. Todo movimiento queda en el
    ledger con su oración, su Meaning, sus refs y sus motivos.
style:
  theme: default
data:
  nodes:
    afuera:
      label: Fuera de pron
      kind: boundary
      contains: [hablante]
    hablante:
      label: Quien habla · persona, LLM u otro producto
      kind: actor
    capa0:
      label: Capa 0 · Mundo
      kind: layer
      contains: [mundo]
    mundo:
      label: "Declaración del mundo · stores, modelos, anchors, proyecciones"
      kind: config
    capa1:
      label: Capa 1 · Superficie
      kind: layer
      contains: [superficie]
    superficie:
      label: "Superficie · natural → Meaning · Meaning → natural"
      kind: surface
    capa2:
      label: Capa 2 · Meaning
      kind: layer
      contains: [gramatica, proyeccion, dialogo, evaluador, operaciones]
    gramatica:
      label: "Gramática viva · anchors · qué hay · qué puedo hacer con X"
      kind: core
    proyeccion:
      label: "Proyección · lo que esta sesión ve y puede"
      kind: core
    dialogo:
      label: "Diálogo · pendiente y referentes (ese, la anterior)"
      kind: core
    evaluador:
      label: "Evaluador · grounding · resolución · expansión · dispatch · traza"
      kind: core
    operaciones:
      label: "Operaciones · leer / escribir / operar / declarar · abiertas"
      kind: core
    capa3:
      label: Capa 3 · Bridges
      kind: layer
      contains: [bridge_sldb, bridge_kgdb, bridge_emb, bridge_otros]
    bridge_sldb:
      label: "Bridge sldb · documentos, campos, secciones"
      kind: bridge
    bridge_kgdb:
      label: "Bridge kgdb · grafo, relaciones, estados"
      kind: bridge
    bridge_emb:
      label: "Bridge embeddings · parecido a · cercanos"
      kind: bridge
    bridge_otros:
      label: "Bridge lo-que-venga · SQL, APIs, ..."
      kind: bridge
    transversal:
      label: Transversal
      kind: layer
      contains: [proyector, ledger]
    proyector:
      label: "Proyector · reindexa · reconstruye grafo · recalcula embeddings"
      kind: infra
    ledger:
      label: "Ledger · oración + Meaning + refs + motivos + resultado · provenance"
      kind: infra
    backends:
      label: Backends
      kind: boundary
      contains: [sldb, kgdb, embeddings, otros]
    sldb:
      label: sldb
      kind: external
    kgdb:
      label: kgdb
      kind: external
    embeddings:
      label: embeddings
      kind: external
    otros:
      label: "SQL · APIs · lo que venga"
      kind: external
  edges:
