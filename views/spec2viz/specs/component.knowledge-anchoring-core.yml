id: component.knowledge-anchoring-core
title: Knowledge Anchoring Core Components
type: component
version: "0.1"
data:
  nodes:
    KnowledgeCLI:
      label: knowledge CLI
      kind: core
      contains:
        - SurfaceParser
        - Desugarer
        - Session
        - Evaluator
        - Renderer

    SurfaceParser:
      label: surface_parser (tokenize, detect order)
      kind: boundary

    Desugarer:
      label: desugarer (surface -> s-expr, deterministic)
      kind: core

    Session:
      label: session (pending expr, TTL 15m + store_hash)
      kind: state

    Evaluator:
      label: evaluator (dispatch by anchor kind)
      kind: core

    Renderer:
      label: renderer (JSON/text, always refs)
      kind: boundary

    AnchorRegistry:
      label: anchor_registry (AnchorDoc lookup)
      kind: core

    NounResolver:
      label: noun_resolver (Resolved|Ambiguous|Missing)
      kind: core

    OpDispatcher:
      label: op_dispatcher (check/next/return | assert/create/ingest)
      kind: core

    SldbBridge:
      label: sldb bridge (only door to sldb)
      kind: boundary

    KgdbBridge:
      label: kgdb bridge (only door to kgdb)
      kind: boundary

    Projector:
      label: projector (model add / project)
      kind: core

    SldbStore:
      label: .sldb store (docs, models, AnchorDocs)
      kind: external

    KgdbSnapshot:
      label: kgdb snapshot (graph.kg.json)
      kind: external

  edges:
    - from: SurfaceParser
      to: Desugarer
      label: classified tokens
    - from: Desugarer
      to: AnchorRegistry
      label: kind lookup
    - from: Desugarer
      to: Evaluator
      label: s-expression (Meaning)
    - from: Evaluator
      to: AnchorRegistry
      label: symbol -> {kind, ref, motive}
    - from: Evaluator
      to: NounResolver
      label: (doc model "selector")
    - from: Evaluator
      to: OpDispatcher
      label: resolved expression
    - from: NounResolver
      to: Session
      label: Ambiguous -> pending
    - from: NounResolver
      to: SldbBridge
      label: doc search
    - from: OpDispatcher
      to: SldbBridge
      label: reads + writes (with provenance)
    - from: OpDispatcher
      to: KgdbBridge
      label: rel traversal
    - from: AnchorRegistry
      to: SldbBridge
      label: AnchorDoc load
    - from: SldbBridge
      to: SldbStore
      label: library layer only
    - from: KgdbBridge
      to: KgdbSnapshot
      label: validate + warn if stale
    - from: Projector
      to: SldbStore
      label: model add
    - from: Projector
      to: KgdbSnapshot
      label: project (materialize)
    - from: OpDispatcher
      to: Renderer
      label: OperationResult
    - from: Session
      to: Evaluator
      label: clarification resume
